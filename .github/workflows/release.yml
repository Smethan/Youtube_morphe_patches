name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    name: Release
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    env:
      MORPHE_COMPOSITE_ROOT: ${{ runner.temp }}/morphe-public-sources
      MORPHE_LOCAL_MAVEN: ${{ runner.temp }}/morphe-maven
      GRADLE_OPTS: -Dmaven.repo.local=${{ runner.temp }}/morphe-maven
      GITHUB_ACTOR: public-source-build
      GITHUB_TOKEN: unused
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' < <(yes)

      - name: Prepare public Morphe build dependencies
        run: bash scripts/build-from-public-sources.sh --prepare-only

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and release this fork
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
