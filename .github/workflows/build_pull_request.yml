name: Build pull request

on:
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  release:
    name: Build
    runs-on: ubuntu-latest
    env:
      MORPHE_COMPOSITE_ROOT: ${{ runner.temp }}/morphe-public-sources
      MORPHE_LOCAL_MAVEN: ${{ runner.temp }}/morphe-maven
      GRADLE_OPTS: -Dmaven.repo.local=${{ runner.temp }}/morphe-maven
      GITHUB_ACTOR: public-source-build
      GITHUB_TOKEN: unused
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' < <(yes)

      - name: Prepare public Morphe build dependencies
        run: bash scripts/build-from-public-sources.sh --prepare-only

      - name: Test
        run: ./gradlew :patches:test :extensions:youtube:testDebugUnitTest --no-daemon

      # buildAndroid adds DEX to the jar in place. A later JVM task can recreate
      # that same archive without DEX, so Android packaging must run last.
      - name: Build Android bundle
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: patches/build/libs
